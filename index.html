<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Mart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">

<header class="topbar">
  <a href="index.html" class="logo" id="logo">Shopping Mart</a>
  <form id="searchForm"><input id="search" type="search" placeholder="Search products..."></form>
  <button id="cartBtn" class="cart-btn">🛒 <span id="cartCount">0</span></button>
</header>

<nav class="catnav" id="catNav"></nav>

<main>
  <section class="hero">
    <div id="slider" class="slider"></div>
  </section>

  <section class="section">
    <h2>Shop by Category</h2>
    <div id="catTiles" class="tiles"></div>
  </section>

  <section class="section">
    <div class="sec-head">
      <h2>🔥 Today's Deals</h2>
      <a href="shop.html">View all →</a>
    </div>
    <div id="deals" class="menu-grid"></div>
  </section>
</main>

<script src="shared.js"></script>
<script src="app.js"></script>
<script src="boost.js"></script>
<script src="trendy.js"></script>
<script src="alerts.js"></script>
<script src="extras.js"></script>
</body>
</html>
