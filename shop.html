<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop · Shopping Mart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">

<header class="topbar">
  <a href="index.html" class="logo" id="logo">Shopping Mart</a>
  <form id="searchForm"><input id="search" type="search" placeholder="Search products..."></form>
  <button id="cartBtn" class="cart-btn">🛒 <span id="cartCount">0</span></button>
</header>

<nav class="catnav" id="catNav"></nav>

<main class="shop-main">
  <div class="shop-head">
    <h1 id="pageTitle">All Products</h1>
    <select id="sortSel">
      <option value="default">Featured</option>
      <option value="priceAsc">Price: Low to High</option>
      <option value="priceDesc">Price: High to Low</option>
      <option value="discount">Biggest discount</option>
    </select>
  </div>
  <div id="catPills" class="pills"></div>
  <div id="shopGrid" class="menu-grid"></div>
</main>

<script src="shared.js"></script>
<script src="app.js"></script>
<script src="boost.js"></script>
<script src="trendy.js"></script>
<script src="alerts.js"></script>
<script src="extras.js"></script>
</body>
</html>
